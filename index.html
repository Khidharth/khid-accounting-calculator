<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KHID Accounting & Finance Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>KHID Accounting & Finance Calculator</h1>
        <p>Simple tools for accounting and financial calculations.</p>

        <button id="themeToggle">🌙 Dark Mode</button>
    </header>

    <main>

        <section>
            <h2>Accounting Calculators</h2>

            <button>Depreciation</button>
            <button>Profit</button>
            <button>VAT</button>
            <button>Break-even Point</button>
        </section>

        <div class="calculator-selector">
    <label for="calculatorType">Select Calculator</label>

    <select id="calculatorType">
        <option value="simple-interest">Simple Interest</option>
        <option value="compound-interest">Compound Interest</option>
        <option value="present-value">Present Value</option>
        <option value="future-value">Future Value</option>
    </select>
</div>

        <section>
    <h2>Accounting & Finance Calculators</h2>

    <div class="calculator-selector">
        <label for="calculatorType">Select Calculator</label>

        <select id="calculatorType">
            <optgroup label="Finance">
                <option value="simple-interest">Simple Interest</option>
                <option value="compound-interest">Compound Interest</option>
                <option value="present-value">Present Value</option>
                <option value="future-value">Future Value</option>
                <option value="loan-amortization">Loan Amortization</option>
                <option value="sinking-fund">Sinking Fund</option>
                <option value="annuity">Annuity</option>
                <option value="payment">Payment / Installment</option>
            </optgroup>

            <optgroup label="Accounting">
                <option value="straight-line-depreciation">
                    Straight-Line Depreciation
                </option>
                <option value="reducing-balance">
                    Reducing-Balance Depreciation
                </option>
                <option value="book-value">Book Value</option>
                <option value="gross-profit">Gross Profit</option>
                <option value="gross-profit-margin">
                    Gross Profit Margin
                </option>
                <option value="net-profit">Net Profit</option>
                <option value="net-profit-margin">
                    Net Profit Margin
                </option>
                <option value="markup">Markup</option>
                <option value="break-even">Break-Even Point</option>
                <option value="vat">VAT</option>
                <option value="bad-debt">Bad Debt</option>
                <option value="cogs">COGS</option>
            </optgroup>
        </select>
    </div>

    <div id="calculatorForm"></div>

    <div id="result">
        <p>Result will appear here.</p>
    </div>

    <div id="formula">
        <h3>Formula Used</h3>
        <p>Select a calculator to see its formula.</p>
    </div>
</section>

    </main>

    <footer>
      
    <p>© 2026 Simon Khidharth. All rights reserved.</p>
</footer>

    <script src="script.js"></script>

</body>

          </html>
