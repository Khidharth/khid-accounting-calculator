<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KHID Accounting & Finance Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER -->
    <header>

        <h1>KHID Accounting & Finance Calculator</h1>

        <p>
            Accounting, Finance, Mathematics, Statistics & Economics
            Calculation Tool
        </p>

        <button id="themeToggle">
            🌙 Dark Mode
        </button>

    </header>


    <!-- MAIN CONTENT -->
    <main>

        <section class="calculator-section">

            <h2>Calculator</h2>

            <!-- CATEGORY -->
            <div class="input-group">

                <label for="categorySelect">
                    Select Category
                </label>

                <select id="categorySelect">

                    <option value="accounting">
                        Accounting
                    </option>

                    <option value="finance">
                        Finance
                    </option>

                    <option value="mathematics">
                        Mathematics
                    </option>

                    <option value="statistics">
                        Statistics
                    </option>

                    <option value="economics">
                        Economics
                    </option>

                </select>

            </div>


            <!-- CALCULATOR -->
            <div class="input-group">

                <label for="calculatorSelect">
                    Select Calculator
                </label>

                <select id="calculatorSelect">
                    <!-- JavaScript will fill this -->
                </select>

            </div>


            <!-- CALCULATOR TITLE -->
            <div id="calculatorTitle">

                <h2>
                    Select a calculator
                </h2>

            </div>


            <!-- DYNAMIC FORM -->
            <form id="calculatorForm">

                <!-- JavaScript will generate fields here -->

            </form>


            <!-- CALCULATE BUTTON -->
            <button
                id="calculateButton"
                type="button"
            >
                Calculate
            </button>


            <!-- RESULT -->
            <div id="result">

                <h3>Result</h3>

                <p>
                    Select a calculator and enter your values.
                </p>

            </div>

        </section>

    </main>


    <!-- FOOTER -->
    <footer>

        <p>
            © 2026 Simon Khidharth. All rights reserved.
        </p>

    </footer>


    <script src="script.js"></script>

</body>
</html>
