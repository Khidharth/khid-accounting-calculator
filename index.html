<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KHID Accounting & Finance Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>KHID Accounting & Finance Calculator</h1>
        <p>Simple tools for accounting and financial calculations.</p>

        <button id="themeToggle">🌙 Dark Mode</button>
    </header>

    <main>

        <section>
            <h2>Accounting Calculators</h2>

            <button>Depreciation</button>
            <button>Profit</button>
            <button>VAT</button>
            <button>Break-even Point</button>
        </section>

        <div class="calculator-selector">
    <label for="calculatorType">Select Calculator</label>

    <select id="calculatorType">
        <option value="simple-interest">Simple Interest</option>
        <option value="compound-interest">Compound Interest</option>
        <option value="present-value">Present Value</option>
        <option value="future-value">Future Value</option>
    </select>
</div>

        <section>
    <h2>Simple Interest Calculator</h2>

    <label for="principal">Principal (₦)</label>
    <input type="number" id="principal" placeholder="Enter principal">

    <label for="rate">Interest Rate (%)</label>
    <input type="number" id="rate" placeholder="Enter rate">

    <label for="time">Time (Years)</label>
    <input type="number" id="time" placeholder="Enter time">

    <button id="calculateInterest">Calculate</button>

    <div id="result">
    <p>Result will appear here.</p>
</div>

<div id="formula">
    <h3>Formula Used</h3>
    <p>I = (P × R × T) / 100</p>
    <p>A = P + I</p>
</div>

    </main>

    <footer>
      
    <p>© 2026 Simon Khidharth. All rights reserved.</p>
</footer>

    <script src="script.js"></script>

</body>

          </html>
